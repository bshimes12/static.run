<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  cursor: default;
}

.scene {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* Intro text */
.intro-text {
  font-size: clamp(24px, 5vw, 40px);
  color: rgba(255, 255, 255, 0.7);
  font-weight: 300;
  letter-spacing: 3px;
  margin-bottom: 30px;
  transition: opacity 0.8s ease;
}

/* Click me prompt */
.click-prompt {
  font-size: clamp(14px, 3vw, 20px);
  color: rgba(255, 215, 0, 0.8);
  margin-top: 20px;
  animation: pulse 1.5s ease-in-out infinite;
  cursor: pointer;
  transition: opacity 0.5s ease;
  letter-spacing: 1px;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.08); }
}

/* Present wrapper */
.present-wrapper {
  position: relative;
  cursor: pointer;
  transition: transform 3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.present-wrapper.growing {
  transform: scale(3.75);
}

/* Glow behind present */
.present-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  height: 200px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(108, 92, 231, 0.3) 0%, rgba(255, 215, 0, 0.1) 40%, transparent 70%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 2s ease;
  pointer-events: none;
}

.growing .present-glow {
  opacity: 1;
}

/* SVG present details that appear during growth */
.detail-layer {
  opacity: 0;
  transition: opacity 1.5s ease 1s;
}

.growing .detail-layer {
  opacity: 1;
}

/* Wobble phase */
@keyframes wobble {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-2deg); }
  40% { transform: rotate(2.5deg); }
  60% { transform: rotate(-3deg); }
  80% { transform: rotate(3.5deg); }
}

@keyframes wobble-intense {
  0%, 100% { transform: rotate(0deg); }
  15% { transform: rotate(-4deg); }
  30% { transform: rotate(5deg); }
  45% { transform: rotate(-6deg); }
  60% { transform: rotate(6deg); }
  75% { transform: rotate(-5deg); }
  90% { transform: rotate(4deg); }
}

.wobbling .present-svg {
  animation: wobble 0.4s ease-in-out infinite;
}

.wobbling-intense .present-svg {
  animation: wobble-intense 0.25s ease-in-out infinite;
}

/* Sparkle animation */
@keyframes sparkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

.sparkle {
  animation: sparkle 1.5s ease-in-out infinite;
}

.sparkle:nth-child(2) { animation-delay: 0.3s; }
.sparkle:nth-child(3) { animation-delay: 0.7s; }
.sparkle:nth-child(4) { animation-delay: 1.1s; }

/* Idle bob */
@keyframes idle-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.present-wrapper.idle {
  animation: idle-bob 2.5s ease-in-out infinite;
}

/* Explosion - lid flies up */
.lid-piece {
  transition: none;
}

.exploded .lid-piece {
  animation: lid-fly 0.6s ease-out forwards;
}

@keyframes lid-fly {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-600px) rotate(25deg); opacity: 0; }
}

/* Box sides burst */
.box-piece {
  transition: none;
}

.exploded .box-left {
  animation: burst-left 0.5s ease-out forwards;
}

.exploded .box-right {
  animation: burst-right 0.5s ease-out forwards;
}

@keyframes burst-left {
  0% { transform: translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateX(-300px) rotate(-30deg); opacity: 0; }
}

@keyframes burst-right {
  0% { transform: translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateX(300px) rotate(30deg); opacity: 0; }
}

/* Particle layer */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* Confetti */
@keyframes confetti-fall {
  0% { transform: translate(var(--tx), var(--ty)) rotate(var(--r0)) scale(var(--s)); opacity: 1; }
  15% { opacity: 1; }
  100% { transform: translate(var(--tx-end), calc(100vh + 50px)) rotate(var(--r1)) scale(var(--s)); opacity: 0.8; }
}

@keyframes confetti-drift {
  0%, 100% { transform: translate(var(--drift-x), var(--drift-y)) rotate3d(1, 1, 0, 0deg); }
  25% { transform: translate(calc(var(--drift-x) + 15px), var(--drift-y)) rotate3d(1, 0.5, 0, 90deg); }
  50% { transform: translate(var(--drift-x), calc(var(--drift-y) + 10px)) rotate3d(0.5, 1, 0, 180deg); }
  75% { transform: translate(calc(var(--drift-x) - 15px), var(--drift-y)) rotate3d(1, 1, 0, 270deg); }
}

.confetti {
  position: absolute;
  border-radius: 2px;
}

/* Balloons */
@keyframes balloon-rise {
  0% { transform: translate(var(--bx), var(--by)) scale(0); opacity: 0; }
  10% { opacity: 1; transform: translate(var(--bx), var(--by)) scale(1); }
  100% { transform: translate(var(--bx-end), var(--by-end)) scale(1); opacity: 1; }
}

@keyframes balloon-bob {
  0%, 100% { transform: translate(var(--bob-x), var(--bob-y)); }
  33% { transform: translate(calc(var(--bob-x) + 8px), calc(var(--bob-y) - 12px)); }
  66% { transform: translate(calc(var(--bob-x) - 8px), calc(var(--bob-y) - 6px)); }
}

.balloon {
  position: absolute;
  width: var(--bsize);
  height: calc(var(--bsize) * 1.2);
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  opacity: 0;
  z-index: 0;
  cursor: pointer;
  pointer-events: auto;
}

.balloon.popping {
  animation: pop 0.3s ease-out forwards !important;
  pointer-events: none;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.6; }
  100% { transform: scale(0); opacity: 0; }
}

.balloon::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 50%;
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.4);
  transform: translateX(-50%);
}

/* Streamers */
@keyframes streamer-fly {
  0% { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scaleY(0); opacity: 0; }
  10% { opacity: 0.8; scaleY: 1; }
  100% { transform: translate(var(--sx-end), var(--sy-end)) rotate(var(--sr-end)) scaleY(1); opacity: 0.7; }
}

@keyframes streamer-sway {
  0%, 100% { transform: translate(var(--sway-x), var(--sway-y)) rotate(var(--sway-r)); }
  50% { transform: translate(calc(var(--sway-x) + 20px), calc(var(--sway-y) + 10px)) rotate(calc(var(--sway-r) + 5deg)); }
}

.streamer {
  position: absolute;
  width: 8px;
  border-radius: 4px;
  opacity: 0;
}

/* Colored balls */
@keyframes ball-scatter {
  0% { transform: translate(var(--ballx), var(--bally)) scale(0); opacity: 0; }
  15% { opacity: 1; transform: translate(var(--ballx), var(--bally)) scale(1); }
  100% { transform: translate(var(--ballx-end), var(--bally-end)) scale(1); opacity: 0.9; }
}

@keyframes ball-settle {
  0%, 100% { transform: translate(var(--settle-x), var(--settle-y)); }
  50% { transform: translate(calc(var(--settle-x) + 3px), calc(var(--settle-y) - 3px)); }
}

.ball {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
}

/* Final message */
.final-message {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.final-message.visible {
  opacity: 1;
}

.final-message h1 {
  font-size: clamp(36px, 10vw, 90px);
  font-weight: 900;
  color: white;
  text-shadow: 2px 4px 20px rgba(0,0,0,0.5), 0 0 40px rgba(255,255,255,0.2);
  letter-spacing: 3px;
  text-align: center;
  line-height: 1.2;
}

.final-message .name {
  display: block;
  font-size: clamp(48px, 14vw, 120px);
  color: #ff2d2d;
  text-shadow: 0 0 30px rgba(255, 45, 45, 0.5), 2px 4px 15px rgba(0,0,0,0.4);
  -webkit-text-fill-color: #ff2d2d;
}

.pop-hint {
  font-size: clamp(12px, 2vw, 16px);
  color: rgba(255, 255, 255, 0.7);
  margin-top: 20px;
  letter-spacing: 1px;
  opacity: 0;
  animation: hint-float 3s ease-in-out infinite;
  transition: opacity 1.5s ease 0.8s;
}

.final-message.visible .pop-hint {
  opacity: 1;
}

@keyframes hint-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Blue bird */
.bird {
  position: absolute;
  z-index: 15;
  pointer-events: none;
  animation: bird-fly var(--bird-dur) ease-in-out forwards;
}

@keyframes bird-fly {
  0% { transform: translate(0, 0) scaleX(var(--bird-dir)) rotate(0deg); opacity: 1; }
  20% { transform: translate(calc(var(--bird-dx) * 0.2), -80px) scaleX(var(--bird-dir)) rotate(-8deg); opacity: 1; }
  60% { transform: translate(calc(var(--bird-dx) * 0.6), -160px) scaleX(var(--bird-dir)) rotate(5deg); opacity: 1; }
  100% { transform: translate(var(--bird-dx), -280px) scaleX(var(--bird-dir)) rotate(-3deg); opacity: 0; }
}

.bird-wing {
  transform-origin: center right;
  animation: wing-flap 0.2s ease-in-out infinite alternate;
}

.bird-wing-right {
  transform-origin: center left;
  animation: wing-flap-r 0.2s ease-in-out infinite alternate;
}

@keyframes wing-flap {
  0% { transform: rotate(30deg); }
  100% { transform: rotate(-30deg); }
}

@keyframes wing-flap-r {
  0% { transform: rotate(-30deg); }
  100% { transform: rotate(30deg); }
}

/* Hide scene after explosion */
.scene.hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="intro-text" id="introText">Happy Birthday</div>

  <div class="present-wrapper idle" id="presentWrapper">
    <div class="present-glow"></div>
    <svg class="present-svg" width="80" height="90" viewBox="0 0 140 160">
      <!-- Box body -->
      <defs>
        <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6c5ce7"/>
          <stop offset="100%" stop-color="#4a3db5"/>
        </linearGradient>
        <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffd700"/>
          <stop offset="50%" stop-color="#ffec80"/>
          <stop offset="100%" stop-color="#ffd700"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a4bcc"/>
          <stop offset="100%" stop-color="#4a3db5"/>
        </linearGradient>
      </defs>

      <!-- Box body pieces (for explosion) -->
      <g class="box-piece box-left">
        <rect x="22" y="65" width="48" height="75" rx="3" fill="url(#boxGrad)" stroke="#5a4bcc" stroke-width="1.5"/>
      </g>
      <g class="box-piece box-right">
        <rect x="70" y="65" width="48" height="75" rx="3" fill="url(#boxGrad)" stroke="#5a4bcc" stroke-width="1.5"/>
      </g>

      <!-- Detail lines (appear during growth) -->
      <g class="detail-layer">
        <line x1="22" y1="85" x2="118" y2="85" stroke="#7c6ef0" stroke-width="0.5" opacity="0.4"/>
        <line x1="22" y1="105" x2="118" y2="105" stroke="#7c6ef0" stroke-width="0.5" opacity="0.4"/>
        <line x1="22" y1="125" x2="118" y2="125" stroke="#7c6ef0" stroke-width="0.5" opacity="0.4"/>
        <!-- Diamond pattern -->
        <path d="M35 75 L42 82 L35 89 L28 82 Z" fill="#7c6ef0" opacity="0.15"/>
        <path d="M95 90 L102 97 L95 104 L88 97 Z" fill="#7c6ef0" opacity="0.15"/>
        <path d="M50 110 L57 117 L50 124 L43 117 Z" fill="#7c6ef0" opacity="0.15"/>
      </g>

      <!-- Gold ribbon vertical -->
      <rect x="63" y="65" width="14" height="75" fill="url(#ribbonGrad)"/>
      <!-- Gold ribbon horizontal -->
      <rect x="22" y="95" width="96" height="10" fill="url(#ribbonGrad)"/>

      <!-- Lid (for explosion) -->
      <g class="lid-piece">
        <rect x="17" y="53" width="106" height="18" rx="3" fill="url(#lidGrad)" stroke="#4a3db5" stroke-width="1.5"/>
        <rect x="17" y="57" width="106" height="10" fill="url(#ribbonGrad)"/>
      </g>

      <!-- Bow -->
      <g class="lid-piece">
        <path d="M70 48 C48 15, 22 28, 48 48" fill="url(#ribbonGrad)" stroke="#daa520" stroke-width="1"/>
        <path d="M70 48 C92 15, 118 28, 92 48" fill="url(#ribbonGrad)" stroke="#daa520" stroke-width="1"/>
        <!-- Inner bow detail -->
        <g class="detail-layer">
          <path d="M70 48 C58 25, 38 35, 55 48" fill="none" stroke="#daa520" stroke-width="0.8" opacity="0.5"/>
          <path d="M70 48 C82 25, 102 35, 85 48" fill="none" stroke="#daa520" stroke-width="0.8" opacity="0.5"/>
          <!-- Ribbon tails -->
          <path d="M60 52 Q50 65, 42 58" fill="none" stroke="#daa520" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M80 52 Q90 65, 98 58" fill="none" stroke="#daa520" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <circle cx="70" cy="48" r="6" fill="#ffd700" stroke="#daa520" stroke-width="1.5"/>
      </g>

      <!-- Sparkles -->
      <text class="sparkle" x="15" y="50" font-size="10" fill="#ffd700" opacity="0.7">&#10022;</text>
      <text class="sparkle" x="120" y="45" font-size="8" fill="#ffd700" opacity="0.6">&#10022;</text>
      <text class="sparkle" x="10" y="90" font-size="7" fill="#ffd700" opacity="0.5">&#10022;</text>
      <text class="sparkle" x="125" y="95" font-size="9" fill="#ffd700" opacity="0.6">&#10022;</text>

      <!-- Extra sparkles (appear during growth) -->
      <g class="detail-layer">
        <text class="sparkle" x="5" y="70" font-size="8" fill="#ffd700" opacity="0.5">&#10022;</text>
        <text class="sparkle" x="130" y="70" font-size="7" fill="#ffd700" opacity="0.5">&#10022;</text>
        <text class="sparkle" x="25" y="30" font-size="9" fill="#ffd700" opacity="0.4">&#10022;</text>
        <text class="sparkle" x="110" y="25" font-size="8" fill="#ffd700" opacity="0.4">&#10022;</text>
      </g>
    </svg>
  </div>

  <div class="click-prompt" id="clickPrompt">&#127873; Click me!</div>
</div>

<div class="particles" id="particles"></div>

<div class="final-message" id="finalMessage">
  <h1>Happy Birthday<span class="name" id="nameDisplay"></span></h1>
  <p class="pop-hint" id="popHint">click the balloons to pop them!</p>
</div>

<script>
(function() {
  // Parse name from query parameter
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const nameEl = document.getElementById('nameDisplay');
  if (name) {
    nameEl.textContent = name + '!';
  } else {
    nameEl.textContent = '!';
  }

  const scene = document.getElementById('scene');
  const wrapper = document.getElementById('presentWrapper');
  const introText = document.getElementById('introText');
  const clickPrompt = document.getElementById('clickPrompt');
  const particlesContainer = document.getElementById('particles');
  const finalMessage = document.getElementById('finalMessage');

  let started = false;

  const COLORS = [
    '#ff6b6b', '#ff6b9d', '#ffd700', '#ffec80', '#ffa502',
    '#7bed9f', '#2ed573', '#74b9ff', '#4d96ff', '#6c5ce7',
    '#a29bfe', '#e74c3c', '#fd79a8', '#00cec9', '#fdcb6e',
    '#e17055', '#ff9ff3', '#f368e0', '#48dbfb', '#1dd1a1'
  ];

  function randRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  function randColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
  }

  function randInt(min, max) {
    return Math.floor(randRange(min, max));
  }

  // Click handler on the whole scene
  scene.addEventListener('click', startAnimation);

  function startAnimation() {
    if (started) return;
    started = true;

    // Phase 1: Growth
    wrapper.classList.remove('idle');
    clickPrompt.style.opacity = '0';
    setTimeout(() => { clickPrompt.style.display = 'none'; }, 500);

    // Start growing
    wrapper.classList.add('growing');

    // Fade intro text
    setTimeout(() => {
      introText.style.opacity = '0';
    }, 1000);

    // Phase 2: Wobble (starts at ~3s)
    setTimeout(() => {
      wrapper.classList.add('wobbling');
    }, 2800);

    // Intensify wobble
    setTimeout(() => {
      wrapper.classList.remove('wobbling');
      wrapper.classList.add('wobbling-intense');
    }, 3400);

    // Phase 3: Explosion (at ~4s)
    setTimeout(() => {
      explode();
    }, 4000);
  }

  function explode() {
    // Add exploded class to break apart the present
    wrapper.classList.remove('wobbling-intense');
    wrapper.classList.add('exploded');

    // Hide scene after pieces fly away
    setTimeout(() => {
      scene.classList.add('hidden');
    }, 400);

    // Spawn all particles from center
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    // Initial burst
    spawnConfetti(cx, cy, 120);
    spawnBalloons(cx, cy, 12, 30, 55);
    spawnStreamers(cx, cy, 10);
    spawnBalls(cx, cy, 25);

    // Wave 2: more balloons, bigger (~1s later)
    setTimeout(() => {
      spawnBalloons(cx, cy, 15, 50, 90);
      spawnConfetti(cx, cy, 60);
    }, 800);

    // Wave 3: even more, even bigger (~2s later)
    setTimeout(() => {
      spawnBalloons(cx, cy, 18, 80, 150);
      spawnBalls(cx, cy, 15);
    }, 1600);

    // Wave 4: massive balloons that become the background (~3s later)
    setTimeout(() => {
      spawnBalloons(cx, cy, 20, 140, 280);
    }, 2400);

    // Wave 5: screen-filling mega balloons
    setTimeout(() => {
      spawnBalloons(cx, cy, 10, 250, 450);
    }, 3200);

    // Phase 4: Show final message (after screen is full of color)
    setTimeout(() => {
      finalMessage.classList.add('visible');
      // Allow clicking through to pop balloons
      particlesContainer.style.pointerEvents = 'auto';
    }, 3800);

    // Phase 5: Start ambient confetti rain
    setTimeout(() => {
      ambientConfetti();
    }, 5000);
  }

  function spawnConfetti(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';

      const size = randRange(6, 14);
      const isCircle = Math.random() > 0.6;
      const color = randColor();
      const angle = randRange(0, Math.PI * 2);
      const velocity = randRange(200, 600);
      const txEnd = Math.cos(angle) * velocity;
      const duration = randRange(2.5, 5);
      const delay = randRange(0, 0.3);

      el.style.width = size + 'px';
      el.style.height = isCircle ? size + 'px' : size * 0.6 + 'px';
      el.style.backgroundColor = color;
      el.style.borderRadius = isCircle ? '50%' : '2px';
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--tx', '0px');
      el.style.setProperty('--ty', '0px');
      el.style.setProperty('--tx-end', txEnd + 'px');
      el.style.setProperty('--r0', randRange(0, 360) + 'deg');
      el.style.setProperty('--r1', randRange(360, 1080) + 'deg');
      el.style.setProperty('--s', randRange(0.8, 1.5));
      el.style.animation = `confetti-fall ${duration}s cubic-bezier(0.25, 0, 0.5, 1) ${delay}s forwards`;

      particlesContainer.appendChild(el);

      // After initial fall, start drift animation
      setTimeout(() => {
        const finalX = cx + txEnd;
        const finalY = window.innerHeight * randRange(0.3, 0.95);
        el.style.left = finalX + 'px';
        el.style.top = finalY + 'px';
        el.style.opacity = '0.8';
        el.style.setProperty('--drift-x', '0px');
        el.style.setProperty('--drift-y', '0px');
        el.style.animation = `confetti-drift ${randRange(3, 6)}s ease-in-out infinite`;
      }, (duration + delay) * 1000);
    }
  }

  function spawnBalloons(cx, cy, count, minSize, maxSize) {
    minSize = minSize || 30;
    maxSize = maxSize || 55;
    const w = window.innerWidth;
    const h = window.innerHeight;

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'balloon';

      const size = randRange(minSize, maxSize);
      const color = randColor();
      // Spread across the full screen, not just upward
      const targetX = randRange(-w * 0.55, w * 0.55);
      const targetY = randRange(-h * 0.55, h * 0.45);
      const duration = randRange(1.5, 3.5);
      const delay = randRange(0, 0.5);

      el.style.setProperty('--bsize', size + 'px');
      el.style.backgroundColor = color;
      el.style.boxShadow = `inset -${size/5}px -${size/5}px ${size/3}px rgba(0,0,0,0.15), inset ${size/6}px ${size/6}px ${size/4}px rgba(255,255,255,0.3)`;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--bx', '0px');
      el.style.setProperty('--by', '0px');
      el.style.setProperty('--bx-end', targetX + 'px');
      el.style.setProperty('--by-end', targetY + 'px');
      el.style.animation = `balloon-rise ${duration}s cubic-bezier(0.2, 0.8, 0.3, 1) ${delay}s forwards`;

      // Pop on click
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        if (el.classList.contains('popping')) return;
        const rect = el.getBoundingClientRect();
        const popX = rect.left + rect.width / 2;
        const popY = rect.top + rect.height / 2;
        el.classList.add('popping');
        // Mini confetti burst at pop location
        spawnConfetti(popX, popY, randInt(8, 15));
        // ~20% chance a little blue bird flies out
        if (Math.random() < 0.2) {
          spawnBird(popX, popY);
        }
        setTimeout(() => el.remove(), 350);
      });

      particlesContainer.appendChild(el);

      // After rise, start bobbing and keep growing
      setTimeout(() => {
        const finalX = cx + targetX;
        const finalY = cy + targetY;
        el.style.left = finalX + 'px';
        el.style.top = finalY + 'px';
        el.style.opacity = '1';
        el.style.setProperty('--bob-x', '0px');
        el.style.setProperty('--bob-y', '0px');
        el.style.animation = `balloon-bob ${randRange(3, 5)}s ease-in-out infinite`;

        // Balloons keep growing after settling — inflating to fill gaps
        const growFactor = randRange(1.2, 1.8);
        el.style.transition = `width ${randRange(3, 6)}s ease, height ${randRange(3, 6)}s ease`;
        const newSize = size * growFactor;
        el.style.width = newSize + 'px';
        el.style.height = (newSize * 1.2) + 'px';
      }, (duration + delay) * 1000);
    }
  }

  function spawnStreamers(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'streamer';

      const height = randRange(60, 140);
      const color = randColor();
      const angle = randRange(0, Math.PI * 2);
      const dist = randRange(150, 500);
      const targetX = Math.cos(angle) * dist;
      const targetY = Math.sin(angle) * dist * 0.7;
      const rotation = randRange(-40, 40);
      const rotEnd = rotation + randRange(-20, 20);
      const duration = randRange(1.5, 3);
      const delay = randRange(0, 0.3);

      el.style.height = height + 'px';
      el.style.backgroundColor = color;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--sx', '0px');
      el.style.setProperty('--sy', '0px');
      el.style.setProperty('--sr', rotation + 'deg');
      el.style.setProperty('--sx-end', targetX + 'px');
      el.style.setProperty('--sy-end', targetY + 'px');
      el.style.setProperty('--sr-end', rotEnd + 'deg');
      el.style.animation = `streamer-fly ${duration}s cubic-bezier(0.25, 0, 0.5, 1) ${delay}s forwards`;

      particlesContainer.appendChild(el);

      // After fly, start swaying
      setTimeout(() => {
        const finalX = cx + targetX;
        const finalY = cy + targetY;
        el.style.left = finalX + 'px';
        el.style.top = finalY + 'px';
        el.style.opacity = '0.7';
        el.style.setProperty('--sway-x', '0px');
        el.style.setProperty('--sway-y', '0px');
        el.style.setProperty('--sway-r', rotEnd + 'deg');
        el.style.animation = `streamer-sway ${randRange(2, 4)}s ease-in-out infinite`;
      }, (duration + delay) * 1000);
    }
  }

  function spawnBalls(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'ball';

      const size = randRange(12, 28);
      const color = randColor();
      const angle = randRange(0, Math.PI * 2);
      const dist = randRange(100, 500);
      const targetX = Math.cos(angle) * dist;
      const targetY = Math.sin(angle) * dist * 0.8;
      const duration = randRange(1.5, 3.5);
      const delay = randRange(0, 0.4);

      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.backgroundColor = color;
      el.style.boxShadow = `inset -${size/6}px -${size/6}px ${size/4}px rgba(0,0,0,0.2), inset ${size/8}px ${size/8}px ${size/5}px rgba(255,255,255,0.25)`;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--ballx', '0px');
      el.style.setProperty('--bally', '0px');
      el.style.setProperty('--ballx-end', targetX + 'px');
      el.style.setProperty('--bally-end', targetY + 'px');
      el.style.animation = `ball-scatter ${duration}s cubic-bezier(0.25, 0, 0.5, 1) ${delay}s forwards`;

      particlesContainer.appendChild(el);

      // After scatter, gentle settle
      setTimeout(() => {
        const finalX = cx + targetX;
        const finalY = cy + targetY;
        el.style.left = finalX + 'px';
        el.style.top = finalY + 'px';
        el.style.opacity = '0.9';
        el.style.setProperty('--settle-x', '0px');
        el.style.setProperty('--settle-y', '0px');
        el.style.animation = `ball-settle ${randRange(2, 4)}s ease-in-out infinite`;
      }, (duration + delay) * 1000);
    }
  }

  function spawnBird(x, y) {
    const el = document.createElement('div');
    el.className = 'bird';
    const goRight = Math.random() > 0.5;
    const dx = (goRight ? 1 : -1) * randRange(200, 450);
    const dur = randRange(2, 3);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--bird-dx', dx + 'px');
    el.style.setProperty('--bird-dir', goRight ? '1' : '-1');
    el.style.setProperty('--bird-dur', dur + 's');
    el.innerHTML = `<svg width="72" height="52" viewBox="0 0 44 32">
      <g class="bird-wing" transform="translate(10,8)">
        <path d="M12 8 Q6 -4, 0 2 Q4 6, 12 8" fill="#4da6ff"/>
      </g>
      <g class="bird-wing-right" transform="translate(22,8)">
        <path d="M0 8 Q6 -4, 12 2 Q8 6, 0 8" fill="#4da6ff"/>
      </g>
      <ellipse cx="22" cy="14" rx="8" ry="6" fill="#3b9eff"/>
      <circle cx="28" cy="11" r="2.5" fill="white"/>
      <circle cx="28.8" cy="11" r="1.2" fill="#222"/>
      <path d="M32 13 L38 12 L32 15 Z" fill="#ffaa00"/>
      <path d="M14 18 Q16 24, 12 22" fill="#3b9eff" opacity="0.7"/>
    </svg>`;
    particlesContainer.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 100);
  }

  // Ambient confetti that keeps raining gently
  function ambientConfetti() {
    function drop() {
      const el = document.createElement('div');
      el.className = 'confetti';

      const size = randRange(5, 10);
      const isCircle = Math.random() > 0.5;
      const color = randColor();

      el.style.width = size + 'px';
      el.style.height = isCircle ? size + 'px' : size * 0.6 + 'px';
      el.style.backgroundColor = color;
      el.style.borderRadius = isCircle ? '50%' : '2px';
      el.style.left = randRange(0, window.innerWidth) + 'px';
      el.style.top = '-20px';
      el.style.opacity = '0.7';

      const drift = randRange(-80, 80);
      const duration = randRange(4, 8);
      el.style.setProperty('--tx', '0px');
      el.style.setProperty('--ty', '0px');
      el.style.setProperty('--tx-end', drift + 'px');
      el.style.setProperty('--r0', randRange(0, 360) + 'deg');
      el.style.setProperty('--r1', randRange(360, 720) + 'deg');
      el.style.setProperty('--s', randRange(0.6, 1.2));
      el.style.animation = `confetti-fall ${duration}s linear forwards`;

      particlesContainer.appendChild(el);

      // Remove after animation
      setTimeout(() => {
        el.remove();
      }, duration * 1000 + 100);
    }

    // Drop confetti at intervals
    setInterval(() => {
      const batch = randInt(1, 4);
      for (let i = 0; i < batch; i++) {
        setTimeout(drop, randRange(0, 300));
      }
    }, 400);
  }
})();
</script>
</body>
</html>
